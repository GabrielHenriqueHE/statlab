[project]
name = "statlab"
version = "0.1.0"
description = "Análise estatística em pt-BR no modelo do Minitab: você escolhe o comando e as opções, o app calcula."
readme = "README.md"
authors = [
    { name = "Gabriel Evaristo", email = "gabriel.evaristo.2004@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "statsmodels>=0.14",
    "streamlit>=1.37",
    "plotly>=5.20",
    "openpyxl>=3.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
statlab = "statlab:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 120
extend-exclude = ["docs"]
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N"]
# ErroDeDados é nome de domínio em português (plano do projeto); não seguir o sufixo "Error".
ignore = ["N818"]
